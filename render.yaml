services:
  - type: web
    name: foxtrail-family-test
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: family-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: FOXTRAIL_TEST_MODE
        value: "false"
      - key: FOXTRAIL_DATABASE_PATH
        value: /var/data/family.sqlite
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FOXTRAIL_OWNER_IDS
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: QUESTBURROW_OPERATOR_NAME
        sync: false
      - key: QUESTBURROW_OPERATOR_ADDRESS
        sync: false
      - key: QUESTBURROW_OPERATOR_PHONE
        sync: false
      - key: QUESTBURROW_PRIVACY_KEY
        sync: false
      - key: QUESTBURROW_PRIVACY_OPERATIONS_READY
        value: "false"
      - key: QUESTBURROW_MAINTENANCE_SECRET
        generateValue: true
